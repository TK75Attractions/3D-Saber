<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>置き場テスト</title><style>body{background:#09131f;color:#e7f1ff;font:16px/1.7 system-ui;max-width:900px;margin:auto;padding:16px}a{color:#64dbef}canvas{width:100%;aspect-ratio:16/9;background:#07101c}button,select{font:inherit;padding:12px;background:#193a4c;color:white;border:1px solid #527585;border-radius:8px}p{max-width:680px}.controls{display:flex;gap:12px;flex-wrap:wrap}</style><a href="design.html">← 5曲の改修</a><h1>内外・上下の置き場テスト</h1><p>無音・12秒・タップのみ。同じ手には1.5秒の間隔があります。内側±0.6／外側±1.9、下−0.6／上+0.3。2.7〜3.1mの普段の位置で、外側へ届くか、上段でカメラが見失わないかを確認するための譜面です。</p><canvas id="stage" width="960" height="540"></canvas><div class="controls"><button id="play">▶ 再生</button><button id="reset">先頭へ</button><select id="speed"><option value="1">1倍</option><option value="0.5">0.5倍</option></select><span id="time"></span></div><p>自動ループします。このブラウザ表示は実機の当たり判定テストではありません。<a href="reach-trial.json" download>試し譜面JSONを保存</a></p><script type="module">import{prepare}from'./pattern-renderer/core.js';import{draw}from'./pattern-renderer/renderer.js';const raw=await fetch('reach-trial.json').then(r=>r.json()),chart=prepare(raw);let t=-1,playing=false,last=0;document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Ⅱ 一時停止':'▶ 再生'};document.querySelector('#reset').onclick=()=>t=-1;function tick(now){if(playing)t+=(now-last)/1000*Number(document.querySelector('#speed').value);if(t>12)t=-1;last=now;draw(document.querySelector('#stage'),chart,t,1);document.querySelector('#time').textContent=Math.max(0,t).toFixed(1)+' / 12秒';requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
